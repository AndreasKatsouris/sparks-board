<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>Sparks Board</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230f1720'/><text y='70' x='50' text-anchor='middle' font-size='60' fill='%23f6c453'>S</text></svg>">
<style>
  :root{
    --bg:#0f1720; --panel:#172230; --panel2:#1e2b3c; --line:#2a3a4f;
    --ink:#e8eef5; --dim:#90a2b8; --accent:#f6c453; --on-accent:#0f1720;
    --go:#3fa66a; --draft:#4a90d9; --no:#c2544a; --warn:#e2893b; --no-ink:#e79a92;
    --over-bg:#3a1f1c; --over-ink:#ef8c82;
    --mode-bg:#1d3147; --mode-ink:#8fc2f0;
    --ok-bg:#15291f; --ok-ink:#86d6a6; --ok-line:#27503a;
    --bad-bg:#2b1a18; --bad-ink:#e79a92; --bad-line:#4d2b27;
    --shadow:none;
  }
  /* The light palette is identical in both blocks. One applies when he picks Light,
     the other when he leaves it on Auto and the device is light. */
  html[data-theme="light"]{
    --bg:#f3f6f9; --panel:#ffffff; --panel2:#e9eef4; --line:#dce3eb;
    --ink:#15202c; --dim:#5c6b7d; --accent:#a0711a; --on-accent:#ffffff;
    --go:#2f8b58; --draft:#2f6fb5; --no:#b03a31; --warn:#9a5c17; --no-ink:#a3302a;
    --over-bg:#fbe8e6; --over-ink:#9c2f28;
    --mode-bg:#e5effb; --mode-ink:#1f5a99;
    --ok-bg:#e7f6ed; --ok-ink:#1c6b3f; --ok-line:#c0e2cd;
    --bad-bg:#fbe8e6; --bad-ink:#9c2f28; --bad-line:#f0c6c2;
    --shadow:0 1px 2px rgba(20,35,55,.07);
  }
  @media (prefers-color-scheme: light){
    html[data-theme="auto"]{
      --bg:#f3f6f9; --panel:#ffffff; --panel2:#e9eef4; --line:#dce3eb;
      --ink:#15202c; --dim:#5c6b7d; --accent:#a0711a; --on-accent:#ffffff;
      --go:#2f8b58; --draft:#2f6fb5; --no:#b03a31; --warn:#9a5c17; --no-ink:#a3302a;
      --over-bg:#fbe8e6; --over-ink:#9c2f28;
      --mode-bg:#e5effb; --mode-ink:#1f5a99;
      --ok-bg:#e7f6ed; --ok-ink:#1c6b3f; --ok-line:#c0e2cd;
      --bad-bg:#fbe8e6; --bad-ink:#9c2f28; --bad-line:#f0c6c2;
      --shadow:0 1px 2px rgba(20,35,55,.07);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);
    padding:14px 16px 0;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:17px;letter-spacing:.3px}
  h1 span{color:var(--accent)}
  .hrow{display:flex;align-items:center;gap:10px}
  .hrow h1{flex:1}
  #theme,#notif{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    border-radius:20px;padding:6px 11px;font:600 11px/1 inherit;cursor:pointer;white-space:nowrap}
  #notif.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  #notif.busy{opacity:.5;pointer-events:none}
  .sub{color:var(--dim);font-size:12px;margin:2px 0 10px}
  nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--dim);font:600 13px/1 inherit;padding:10px 12px;cursor:pointer}
  nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
  nav button b{display:inline-block;margin-left:5px;background:var(--panel2);color:var(--dim);
    border-radius:9px;padding:2px 6px;font-size:11px}
  nav button.on b{background:var(--accent);color:var(--on-accent)}
  main{padding:12px 12px 40px;max-width:760px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .card.done{opacity:.5}
  .top{display:flex;gap:8px;align-items:flex-start}
  .ttl{font-weight:600;flex:1;font-size:15px}
  .id{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;padding-top:2px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--panel2);color:var(--dim)}
  .chip.due{color:var(--warn)}
  .chip.over{background:var(--over-bg);color:var(--over-ink)}
  .chip.mode{background:var(--mode-bg);color:var(--mode-ink)}
  .detail{color:var(--dim);font-size:13.5px;white-space:pre-wrap;margin-top:9px;
    padding-top:9px;border-top:1px solid var(--line);display:none}
  .card.open .detail{display:block}
  .more{color:var(--accent);font-size:12px;margin-top:8px;cursor:pointer;display:inline-block}
  .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .acts button{flex:1 1 auto;min-width:92px;border:1px solid var(--line);background:var(--panel2);
    color:var(--ink);border-radius:9px;padding:10px 12px;font:600 13px/1 inherit;cursor:pointer}
  .acts button.go{background:var(--go);border-color:var(--go);color:#fff}
  .acts button.draft{background:var(--draft);border-color:var(--draft);color:#fff}
  .acts button.no{background:none;border-color:var(--no);color:var(--no-ink)}
  .decided{margin-top:10px;padding:9px 11px;border-radius:9px;background:var(--ok-bg);
    color:var(--ok-ink);font-size:12.5px;border:1px solid var(--ok-line)}
  .decided.no{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-line)}
  .empty{color:var(--dim);text-align:center;padding:50px 20px;font-size:14px}
  /* Schedule view. Deliberately a separate section, not a fifth Kanban column:
     these are standing automations, not things he decides on. */
  .vsw{display:flex;gap:0;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:2px;margin:0 auto 9px;max-width:760px}
  .vsw button{flex:1;background:none;border:none;color:var(--dim);border-radius:7px;
    padding:7px 10px;font:600 12.5px/1 inherit;cursor:pointer}
  .vsw button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  /* Forms are standalone pages, not board views: they live in the Pages repo next to
     index.html and hold nothing, so they are plain links rather than tabs. */
  .flk{display:flex;gap:6px;flex-wrap:wrap;margin:0 auto 9px;max-width:760px}
  .flk a{flex:1 1 auto;text-align:center;text-decoration:none;background:var(--panel2);
    border:1px solid var(--line);border-radius:9px;color:var(--dim);
    padding:8px 10px;font:600 12.5px/1 inherit}
  .flk a:active{color:var(--ink)}
  .flk a b{color:var(--ink);font-weight:700}
  /* Search deliberately ignores the column tabs: the whole point is finding a card
     whose column he cannot remember, most often one already in Done. */
  .srch{position:relative;max-width:760px;margin:0 auto 9px}
  .srch input{width:100%;padding:9px 34px 9px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font:14px/1.25 inherit;-webkit-appearance:none}
  .srch input::placeholder{color:var(--dim)}
  .srch input::-webkit-search-cancel-button{display:none}
  .srch b{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--dim);
    font:600 17px/1 inherit;cursor:pointer;padding:5px 9px}
  .found{color:var(--dim);font-size:11.5px;margin:0 0 10px}
  .chip.col{background:var(--mode-bg);color:var(--mode-ink)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:11px 12px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat span{color:var(--dim);font-size:11px}
  .sec{color:var(--dim);font-size:11.5px;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;margin:18px 0 8px}
  .sec:first-child{margin-top:0}
  .trow{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
  .trow.off{opacity:.5}
  .thead{display:flex;gap:9px;align-items:baseline}
  .temo{font-size:16px;line-height:1}
  .tname{font-weight:600;flex:1;font-size:14.5px}
  .tnext{color:var(--accent);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tdesc{color:var(--dim);font-size:12.5px;margin:5px 0 0 25px}
  .tmeta{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 0 25px}
  .tmeta .chip{font-size:10.5px;padding:2px 7px}
  .chip.flag{background:var(--over-bg);color:var(--over-ink)}
  .tid{color:var(--dim);font-size:10px;margin:7px 0 0 25px;font-variant-numeric:tabular-nums;opacity:.65}
  #login{max-width:330px;margin:16vh auto;padding:0 20px;text-align:center}
  #login input{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-size:16px}
  #login button{width:100%;padding:13px;margin-top:10px;border:none;border-radius:10px;
    background:var(--accent);color:var(--on-accent);font:700 15px/1 inherit;cursor:pointer}
  .err{color:var(--no-ink);font-size:13px;min-height:18px;margin-top:10px}
  .hide{display:none!important}
</style>
<!-- Applied before first paint, otherwise a light-mode phone flashes the dark palette on every load. -->
<script>document.documentElement.dataset.theme = localStorage.getItem('sparksboard.theme') || 'auto';</script>
</head>
<body>

<div id="login">
  <h1>Sparks <span>Board</span></h1>
  <p class="sub">Sign in once. This device stays signed in.</p>
  <input id="em" type="email" placeholder="email" autocomplete="username">
  <input id="pw" type="password" placeholder="password" autocomplete="current-password">
  <button id="go">Sign in</button>
  <div class="err" id="err"></div>
</div>

<div id="app" class="hide">
  <header>
    <div class="hrow">
      <h1>Sparks <span>Board</span></h1>
      <button id="notif" type="button" class="hide"></button>
      <button id="theme" type="button"></button>
    </div>
    <div class="sub" id="stamp"></div>
    <div class="vsw">
      <button id="vboard" class="on" data-view="board">Board</button>
      <button id="vsched" data-view="schedule">Schedule</button>
    </div>
    <div class="flk">
      <a href="contacts.html"><b>Contacts to capture</b> &rsaquo;</a>
      <a href="attributes.html"><b>Google attributes</b> &rsaquo;</a>
    </div>
    <div class="srch" id="srch">
      <input id="q" type="search" placeholder="Find a card: K059, or any word" autocomplete="off" spellcheck="false">
      <b id="qx" class="hide">&times;</b>
    </div>
    <nav id="tabs"></nav>
  </header>
  <main id="list"></main>
</div>

<script type="module">
// Firebase over plain REST rather than the web SDK: one file, no CDN dependency,
// nothing to drift on a version bump. Costs live updates, so the board polls instead.
const API = "AIzaSyBf96GNLhtz6FDdbLxIW9efh98WG__eQmk", DB = "https://merakicaptiveportal-firebasedb-default-rtdb.firebaseio.com";
const VAPID = "BJOL9A4DfdA7ck2tJdQSGAc3Gdw4IXyLevadY-4KcrfMUpA87n1_wqy_e9vJ_sgZGzn7Tf8vBn03li1lg-0O9FM";
const LS = 'sparksboard.session';
const $ = id => document.getElementById(id);

const session = {
  get:  () => { try { return JSON.parse(localStorage.getItem(LS)); } catch { return null; } },
  set:  s  => localStorage.setItem(LS, JSON.stringify(s)),
  drop: ()  => localStorage.removeItem(LS),
};

async function signIn(email, password) {
  const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, returnSecureToken: true }),
  });
  const j = await r.json();
  if (!j.idToken) throw new Error(j.error?.message || 'SIGNIN_FAILED');
  const s = { uid: j.localId, tok: j.idToken, refresh: j.refreshToken, exp: Date.now() + 3300e3 };
  session.set(s);
  return s;
}

// Tokens last an hour; the board is meant to stay signed in for weeks, so refresh on demand.
async function token() {
  let s = session.get();
  if (!s) return null;
  if (Date.now() < s.exp) return s;
  const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${API}`, {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(s.refresh)}`,
  });
  const j = await r.json();
  if (!j.id_token) { session.drop(); return null; }
  s = { ...s, tok: j.id_token, refresh: j.refresh_token, exp: Date.now() + 3300e3 };
  session.set(s);
  return s;
}

const THEMES = [
  { k:'auto',  label:'Auto' },
  { k:'light', label:'Light' },
  { k:'dark',  label:'Dark' },
];
function paintTheme() {
  const k = document.documentElement.dataset.theme;
  const t = THEMES.find(x => x.k === k) || THEMES[0];
  document.getElementById('theme').textContent = t.label;
  // Keep the browser chrome in step with the page, or the notch area stays dark on a light board.
  document.querySelector('meta[name=theme-color]')
    .setAttribute('content', getComputedStyle(document.body).backgroundColor);
}
document.getElementById('theme').onclick = () => {
  const i = THEMES.findIndex(x => x.k === document.documentElement.dataset.theme);
  const next = THEMES[(i + 1) % THEMES.length].k;
  document.documentElement.dataset.theme = next;
  localStorage.setItem('sparksboard.theme', next);
  paintTheme();
};
// On Auto the device can change under us, so follow it.
matchMedia('(prefers-color-scheme: light)').addEventListener('change', paintTheme);
paintTheme();

// ---- Push notifications -------------------------------------------------------------
// Plain Web Push with our own VAPID keypair, not Firebase Messaging. FCM would need a
// sender id and a service account we do not have, and this needs neither.
const b64 = s => {
  const p = '='.repeat((4 - s.length % 4) % 4);
  const raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
};
// The endpoint URL cannot be a Firebase key (slashes and dots), so index subscriptions by
// a hash of it. Same device resubscribing lands on the same key instead of piling up rows.
async function subKey(endpoint) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(endpoint));
  return [...new Uint8Array(h)].slice(0, 12).map(b => b.toString(16).padStart(2, '0')).join('');
}
const pushOk = 'serviceWorker' in navigator && 'PushManager' in window && location.protocol === 'https:';

async function currentSub() {
  if (!pushOk) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? await reg.pushManager.getSubscription() : null;
}

async function paintNotif() {
  const b = $('notif');
  if (!pushOk) { b.classList.add('hide'); return; }
  b.classList.remove('hide');
  if (Notification.permission === 'denied') {
    b.textContent = 'Alerts blocked'; b.classList.remove('on'); return;
  }
  const s = await currentSub();
  b.classList.toggle('on', !!s);
  b.textContent = s ? 'Alerts on' : 'Alerts off';
}

async function enableNotif() {
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return paintNotif();
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID) });
  const s = await token();
  if (!s) return paintNotif();
  const j = sub.toJSON();
  await fetch(`${DB}/users/${s.uid}/kanban/pushSubs/${await subKey(sub.endpoint)}.json?auth=${s.tok}`, {
    method: 'PUT',
    body: JSON.stringify({ endpoint: j.endpoint, keys: j.keys, ua: navigator.userAgent.slice(0, 120), added: new Date().toISOString() }),
  });
  await paintNotif();
}

async function disableNotif() {
  const sub = await currentSub();
  if (sub) {
    const key = await subKey(sub.endpoint);
    const s = await token();
    if (s) await fetch(`${DB}/users/${s.uid}/kanban/pushSubs/${key}.json?auth=${s.tok}`, { method: 'DELETE' });
    await sub.unsubscribe();
  }
  await paintNotif();
}

$('notif').onclick = async () => {
  const b = $('notif');
  b.classList.add('busy');
  try { (await currentSub()) ? await disableNotif() : await enableNotif(); }
  catch (e) { b.textContent = 'Alerts failed'; }
  finally { b.classList.remove('busy'); }
};

// Keep the service worker current on every load, but only for a device that already opted
// in. Registering unasked would be the first step toward a permission prompt he never wanted.
(async () => {
  if (pushOk && Notification.permission === 'granted') {
    try { await navigator.serviceWorker.register('sw.js'); } catch {}
  }
  paintNotif();
})();
// ---------------------------------------------------------------------------------------

const COLS = [
  { k:'review',   label:'For review' },
  { k:'blocked',  label:'Blocked' },
  { k:'progress', label:'In progress' },
  { k:'done',     label:'Done' },
];
let cards = {}, active = 'review', base = null;
let view = localStorage.getItem('sparksboard.view') || 'board', sched = null;
let query = '';

$('go').onclick = async () => {
  $('err').textContent = 'Signing in...';
  try { await signIn($('em').value.trim(), $('pw').value); $('err').textContent = ''; await start(); }
  catch (e) {
    $('err').textContent = /PASSWORD|EMAIL|CREDENTIAL/i.test(e.message)
      ? 'Wrong email or password.' : 'Could not reach the server. Try again.';
  }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

$('q').addEventListener('input', () => {
  query = $('q').value.trim();
  $('qx').classList.toggle('hide', !query);
  render();
});
$('qx').addEventListener('click', () => {
  $('q').value = ''; query = ''; $('qx').classList.add('hide'); $('q').focus(); render();
});

async function load() {
  const s = await token();
  if (!s) return false;
  base = `${DB}/users/${s.uid}/kanban`;
  const [r, sr] = await Promise.all([
    fetch(`${base}/cards.json?auth=${s.tok}`),
    fetch(`${base}/schedule.json?auth=${s.tok}`),
  ]);
  if (!r.ok) return false;
  cards = (await r.json()) || {};
  // The schedule is published by Sparks, not edited here, so a miss is not fatal.
  if (sr.ok) sched = await sr.json();
  render();
  return true;
}

async function start() {
  if (!(await load())) { $('login').classList.remove('hide'); $('app').classList.add('hide'); return; }
  $('login').classList.add('hide'); $('app').classList.remove('hide');
}

// Which cards he has expanded. render() rebuilds the whole list, so without this the 20s
// refresh collapsed whatever he was busy reading. Also hold the refresh entirely while
// anything is open: do not move the page under him mid-sentence.
const openCards = new Set();

setInterval(() => {
  if ($('app').classList.contains('hide')) return;
  if (openCards.size) return;
  load();
}, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
start();

const today = new Date().toISOString().slice(0, 10);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
const dayDiff = d => Math.round((new Date(d) - new Date(today)) / 86400000);

// Ids are padded to three digits, so "K59" and "59" have to find K059 or the search is
// useless on a phone. Fall back to a plain text match so a half-remembered title also works.
function matches(c, q) {
  const n = s => String(s ?? '').toLowerCase();
  const id = n(c.id), t = n(q);
  if (id.includes(t)) return true;
  const a = id.match(/^([a-z]*)0*(\d+)$/), b = t.match(/^([a-z]*)0*(\d+)$/);
  if (a && b && a[1].startsWith(b[1]) && a[2] === b[2]) return true;
  return [c.title, c.tag, c.detail, c.owner, c.decision?.label].some(v => n(v).includes(t));
}

function dueChip(d) {
  if (!d) return '';
  const n = dayDiff(d);
  if (n < 0)  return `<span class="chip over">${-n}d overdue</span>`;
  if (n === 0) return `<span class="chip over">due today</span>`;
  if (n <= 3) return `<span class="chip due">due ${d}</span>`;
  return `<span class="chip">due ${d}</span>`;
}

async function decide(id, action, label) {
  const patch = {
    decision: { action, label: label || action, at: new Date().toISOString() },
    // Approving does not finish the job, it hands it to me. Only a rejection is done on the spot.
    column: action === 'reject' ? 'done' : 'progress',
    updated: new Date().toISOString(),
  };
  cards[id] = { ...cards[id], ...patch };   // optimistic, so the tap feels instant
  render();
  const s = await token();
  const r = await fetch(`${base}/cards/${id}.json?auth=${s.tok}`, { method: 'PATCH', body: JSON.stringify(patch) });
  if (!r.ok) { alert('Could not save that. Check your signal and try again.'); }
  load();
}

function actions(c) {
  if (c.decision) {
    const bad = c.decision.action === 'reject';
    return `<div class="decided${bad ? ' no' : ''}">${bad ? 'Rejected' : 'You chose'}: <b>${esc(c.decision.label)}</b>
      &middot; ${new Date(c.decision.at).toLocaleString('en-ZA', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })}
      ${c.decision.seen ? '&middot; actioned' : '&middot; sent to Sparks'}</div>`;
  }
  if (c.column !== 'review') return '';
  const b = [];
  if (Array.isArray(c.options) && c.options.length) {
    c.options.forEach((o, i) => b.push(`<button class="${i === 0 ? 'go' : ''}" data-id="${c.id}" data-a="approve" data-l="${esc(o)}">${esc(o)}</button>`));
  } else if (c.mode === 'draft') {
    b.push(`<button class="draft" data-id="${c.id}" data-a="draft" data-l="Draft it first">Draft it first</button>`);
    b.push(`<button class="go" data-id="${c.id}" data-a="approve" data-l="Approved, go">Approved, go</button>`);
  } else {
    b.push(`<button class="go" data-id="${c.id}" data-a="approve" data-l="Approved, go">Approved, go</button>`);
    b.push(`<button class="draft" data-id="${c.id}" data-a="draft" data-l="Draft it first">Draft it first</button>`);
  }
  b.push(`<button class="no" data-id="${c.id}" data-a="reject" data-l="No">No</button>`);
  return `<div class="acts">${b.join('')}</div>`;
}

const GROUPS = [
  { k:'intraday', label:'Through the day' },
  { k:'daily',    label:'Daily' },
  { k:'weekdays', label:'Several days a week' },
  { k:'weekly',   label:'Weekly' },
  { k:'monthly',  label:'Monthly' },
];

function renderSchedule() {
  $('tabs').classList.add('hide');
  if (!sched || !sched.tasks) {
    $('list').innerHTML = `<div class="empty">Schedule has not been published yet.</div>`;
    return;
  }
  const c = sched.counts || {};
  const up = sched.tasks.filter(t => t.status !== 'paused')[0];
  const head = `<div class="stats">
    <div class="stat"><b>${c.active ?? 0}</b><span>Running</span></div>
    <div class="stat"><b>${c.paused ?? 0}</b><span>Paused</span></div>
    <div class="stat"><b>${esc(up ? up.next.replace('Today ', '') : '-')}</b><span>Next up</span></div>
  </div>`;

  const row = t => `<div class="trow${t.status === 'paused' ? ' off' : ''}">
    <div class="thead">
      <span class="temo">${esc(t.emoji)}</span>
      <span class="tname">${esc(t.name)}</span>
      <span class="tnext">${esc(t.next)}</span>
    </div>
    <div class="tdesc">${esc(t.desc)}</div>
    <div class="tmeta">
      <span class="chip">${esc(t.schedule)}</span>
      <span class="chip">to ${esc(t.to)}</span>
      <span class="chip">from ${esc(t.source)}</span>
      ${t.uncatalogued ? '<span class="chip flag">uncatalogued</span>' : ''}
    </div>
    <div class="tid">${esc(t.id)} &middot; ${esc(t.cron)}</div>
  </div>`;

  const body = GROUPS.map(g => {
    const rows = sched.tasks.filter(t => t.group === g.k && t.status !== 'paused');
    return rows.length ? `<div class="sec">${g.label} &middot; ${rows.length}</div>${rows.map(row).join('')}` : '';
  }).join('');

  const off = sched.tasks.filter(t => t.status === 'paused');
  const offBlock = off.length ? `<div class="sec">Paused &middot; ${off.length}</div>${off.map(row).join('')}` : '';

  $('list').innerHTML = head + body + offBlock +
    `<div class="tid" style="margin:16px 0 0;text-align:center">Published ${new Date(sched.updated).toLocaleString('en-ZA', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })}</div>`;
}

function render() {
  $('stamp').textContent = new Date().toLocaleString('en-ZA', { weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  if (view === 'schedule') { $('srch').classList.add('hide'); return renderSchedule(); }
  $('srch').classList.remove('hide');
  $('tabs').classList.remove('hide');

  const all = Object.values(cards);
  $('tabs').innerHTML = COLS.map(c => {
    const n = all.filter(x => x.column === c.k).length;
    return `<button class="${c.k === active ? 'on' : ''}" data-col="${c.k}">${c.label}<b>${n}</b></button>`;
  }).join('');

  const byDue = (a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : 1;
  const colOrder = Object.fromEntries(COLS.map((c, i) => [c.k, i]));
  let rows, head = '';
  if (query) {
    $('tabs').classList.add('hide');
    rows = all.filter(c => matches(c, query))
      .sort((a, b) => (colOrder[a.column] - colOrder[b.column]) || byDue(a, b));
    head = `<div class="found">${rows.length} ${rows.length === 1 ? 'card' : 'cards'} matching &ldquo;${esc(query)}&rdquo;, every column including done.</div>`;
  } else {
    rows = all.filter(c => c.column === active).sort(byDue);
  }

  $('list').innerHTML = rows.length ? head + rows.map(c => {
    const blocked = c.column === 'blocked';
    const isOpen = openCards.has(c.id);
    return `<div class="card${isOpen ? ' open' : ''}" data-card="${c.id}">
      <div class="top"><div class="ttl">${esc(c.title)}</div><div class="id">${c.id}</div></div>
      <div class="meta">
        ${query ? `<span class="chip col">${esc(COLS.find(x => x.k === c.column)?.label || c.column)}</span>` : ''}
        ${c.tag ? `<span class="chip">${esc(c.tag)}</span>` : ''}
        ${dueChip(c.due)}
        ${blocked && c.owner ? `<span class="chip">waiting on ${esc(c.owner)}</span>` : ''}
        ${blocked && c.blockedSince ? `<span class="chip over">${dayDiff(c.blockedSince) * -1}d</span>` : ''}
        ${c.column === 'review' && c.mode === 'draft' ? `<span class="chip mode">draft first</span>` : ''}
      </div>
      ${c.detail ? `<span class="more">${isOpen ? 'Hide' : 'Details'}</span><div class="detail">${esc(c.detail)}</div>` : ''}
      ${actions(c)}
    </div>`;
  }).join('') : query
    ? `<div class="empty">No card matches &ldquo;${esc(query)}&rdquo;.</div>`
    : `<div class="empty">Nothing here.${active === 'review' ? '<br>Clear board.' : ''}</div>`;
}

document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]');
  if (v) { view = v.dataset.view; localStorage.setItem('sparksboard.view', view); render(); return; }
  const tab = e.target.closest('[data-col]');
  if (tab) { active = tab.dataset.col; render(); return; }
  const more = e.target.closest('.more');
  if (more) {
    const card = more.closest('.card'), id = card.dataset.card;
    openCards.has(id) ? openCards.delete(id) : openCards.add(id);
    const now = openCards.has(id);
    card.classList.toggle('open', now);
    more.textContent = now ? 'Hide' : 'Details';
    return;
  }
  const btn = e.target.closest('[data-a]');
  if (btn) decide(btn.dataset.id, btn.dataset.a, btn.dataset.l);
});
</script>
</body>
</html>
