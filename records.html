<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Store records</title>
<style>
 :root{--bg:#0f1115;--fg:#e8eaed;--mut:#9aa0a6;--line:#2a2f3a;--acc:#4f8cff}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 #g{max-width:330px;margin:16vh auto;padding:0 20px;text-align:center}
 h1{font-size:22px;margin:0 0 4px}h1 span{color:var(--acc)}
 .sub{color:var(--mut);font-size:13px;margin:0 0 18px}
 input{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid var(--line);
  background:#171a21;color:var(--fg);font-size:16px}
 button{width:100%;padding:13px;margin-top:10px;border:none;border-radius:10px;
  background:var(--acc);color:#fff;font-size:16px;font-weight:600}
 .err{color:#ff8a80;font-size:13px;min-height:18px;margin-top:10px}
 .bk{display:inline-block;margin-top:22px;color:var(--mut);font-size:13px;text-decoration:none}
</style></head><body>
<div id="g">
  <h1>Sparks <span>Board</span></h1>
  <p class="sub">Store records</p>
  <div id="w" class="sub">Checking this device...</div>
  <div id="f" style="display:none">
    <input id="em" type="email" placeholder="email" autocomplete="username">
    <input id="pw" type="password" placeholder="password" autocomplete="current-password">
    <button id="go">Sign in</button>
  </div>
  <div class="err" id="e"></div>
  <a class="bk" href="./">&lsaquo; back to the board</a>
</div>
<script src="./fb.js"></script>
<script>
const NODE = "records";
const LS = 'sparksboard.session';
const $ = i => document.getElementById(i);
const API = (window.SPARKS_FB||{}).apiKey, DB = (window.SPARKS_FB||{}).dbUrl;

const sess = {
  get(){ try { return JSON.parse(localStorage.getItem(LS)); } catch { return null; } },
  set(s){ localStorage.setItem(LS, JSON.stringify(s)); },
};

// Same refresh dance as the board, and the same storage key, so one sign-in covers both.
async function token(){
  let s = sess.get();
  if (!s) return null;
  if (Date.now() < s.exp) return s;
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + API, {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(s.refresh),
  });
  const j = await r.json();
  if (!j.id_token) return null;
  s = { uid: s.uid, tok: j.id_token, refresh: j.refresh_token, exp: Date.now() + 3300e3 };
  sess.set(s);
  return s;
}

async function signIn(email, password){
  const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email, password, returnSecureToken:true }),
  });
  const j = await r.json();
  if (!j.idToken) throw new Error((j.error&&j.error.message) || 'SIGNIN_FAILED');
  sess.set({ uid:j.localId, tok:j.idToken, refresh:j.refreshToken, exp: Date.now()+3300e3 });
}

// The fetch IS the permission check: it reads the signed-in user's OWN private subtree.
async function openPage(){
  const s = await token();
  if (!s) return false;
  const r = await fetch(DB + '/users/' + s.uid + '/pages/' + NODE + '.json?auth=' + s.tok);
  if (!r.ok) return false;
  const html = await r.json();
  if (typeof html !== 'string' || !html) return false;
  document.open(); document.write(html); document.close();
  return true;
}

function ask(msg){
  $('w').style.display = 'none';
  $('f').style.display = '';
  if (msg) $('e').textContent = msg;
}

$('go').onclick = async () => {
  $('e').textContent = 'Signing in...';
  try {
    await signIn($('em').value.trim(), $('pw').value);
    if (!(await openPage())) $('e').textContent = 'Signed in, but this page is not published to your account.';
  } catch (err) {
    $('e').textContent = /PASSWORD|EMAIL|CREDENTIAL/i.test(err.message)
      ? 'Wrong email or password.' : 'Could not reach the server. Try again.';
  }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

(async () => {
  if (!API || !DB) { ask('Configuration did not load. Reload the page.'); return; }
  try { if (await openPage()) return; } catch (e) {}
  ask('');
})();
</script>
</body></html>
